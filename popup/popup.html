<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub PR Reviewer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <svg class="icon pr-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill-rule="evenodd" d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"></path>
        </svg>
        <span class="header-title">Review Requests</span>
        <span id="badge-count" class="badge-pill hidden">0</span>
      </div>

      <div class="header-actions">
        <!-- Live Folder Toggle Button -->
        <button id="btn-toggle-folder" class="icon-button active" title="Arc Live Folder in Tab Bar (click to toggle)" aria-label="Toggle Arc Live Folder">
          <svg class="icon folder-icon" viewBox="0 0 16 16" width="16" height="16">
            <path d="M1.75 1A1.75 1.75 0 000 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0016 13.25v-8.5A1.75 1.75 0 0014.25 3H7.5a.25.25 0 01-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75z"></path>
          </svg>
        </button>

        <!-- Notification Toggle Button -->
        <button id="btn-toggle-notif" class="icon-button" title="Toggle desktop notifications" aria-label="Toggle notifications">
          <svg id="icon-notif-on" class="icon hidden" viewBox="0 0 16 16" width="16" height="16">
            <path d="M8 1.5c-2.363 0-4 1.69-4 3.75v2.869l-.804.805A.75.75 0 003.73 10.2h8.54a.75.75 0 00.534-1.276L12 8.119V5.25C12 3.19 10.363 1.5 8 1.5zM6.5 12a1.5 1.5 0 003 0h-3z"></path>
          </svg>
          <svg id="icon-notif-off" class="icon" viewBox="0 0 16 16" width="16" height="16">
            <path d="M4 5.25c0-.825.26-1.583.714-2.203L1.22 1.22a.75.75 0 011.06-1.06l12.5 12.5a.75.75 0 11-1.06 1.06l-2.025-2.025A2.99 2.99 0 018 13.5a1.5 1.5 0 01-1.5-1.5h1.293L4 8.293V5.25zm8 2.869V5.25c0-2.06-1.637-3.75-4-3.75-.417 0-.814.053-1.185.152L5.438.275C6.23.093 7.086 0 8 0c3.193 0 5.5 2.307 5.5 5.25v2.869l.804.805a.75.75 0 01-.19 1.258l-1.385-1.385L12 8.119z"></path>
          </svg>
        </button>

        <!-- Refresh Button -->
        <button id="btn-refresh" class="icon-button" title="Refresh list" aria-label="Refresh">
          <svg class="icon icon-refresh" viewBox="0 0 16 16" width="16" height="16">
            <path fill-rule="evenodd" d="M8 2.5a5.487 5.487 0 00-4.131 1.869l1.204 1.204A.25.25 0 014.896 6H1.25A.25.25 0 011 5.75V2.104a.25.25 0 01.427-.177l1.38 1.38A7.001 7.001 0 0114.95 7.16a.75.75 0 11-1.49.178A5.5 5.5 0 008 2.5zM1.705 8.005a.75.75 0 01.834.656 5.5 5.5 0 009.592 2.97l-1.204-1.204a.25.25 0 01.177-.427h3.646a.25.25 0 01.25.25v3.646a.25.25 0 01-.427.177l-1.38-1.38A7.001 7.001 0 011.05 8.84a.75.75 0 01.655-.835z"></path>
          </svg>
        </button>

        <!-- Open in GitHub -->
        <a id="link-github" class="icon-button" href="https://github.com/pulls/review-requested" target="_blank" title="Open in GitHub" aria-label="Open review requests in GitHub">
          <svg class="icon" viewBox="0 0 16 16" width="16" height="16">
            <path d="M3.75 2h3.5a.75.75 0 010 1.5h-3.5a.25.25 0 00-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 00.25-.25v-3.5a.75.75 0 011.5 0v3.5A1.75 1.75 0 0112.25 14h-8.5A1.75 1.75 0 012 12.25v-8.5C2 2.784 2.784 2 3.75 2zm6.854-1h4.146a.25.25 0 01.25.25v4.146a.25.25 0 01-.427.177L13.03 4.03 9.28 7.78a.75.75 0 01-1.06-1.06l3.75-3.75-1.543-1.543A.25.25 0 0110.604 1z"></path>
          </svg>
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="content">
      <!-- Loading Skeleton State -->
      <div id="state-loading" class="state-container">
        <div class="skeleton-item">
          <div class="skeleton-line w-40"></div>
          <div class="skeleton-line w-80"></div>
          <div class="skeleton-line w-60"></div>
        </div>
        <div class="skeleton-item">
          <div class="skeleton-line w-50"></div>
          <div class="skeleton-line w-75"></div>
          <div class="skeleton-line w-40"></div>
        </div>
      </div>

      <!-- Logged Out / Sync State -->
      <div id="state-logged-out" class="state-container hidden">
        <div class="empty-icon-wrapper">
          <svg class="empty-icon pr-icon" viewBox="0 0 16 16" width="32" height="32">
            <path fill-rule="evenodd" d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"></path>
          </svg>
        </div>
        <h3 id="logged-out-title">Sync with GitHub</h3>
        <p id="logged-out-msg">Visit your GitHub Review Requests page once to sync your pull requests with this extension.</p>
        <a id="btn-login" class="btn btn-primary" href="https://github.com/pulls/review-requested" target="_blank">
          Open GitHub Review Requests
        </a>
      </div>

      <!-- Empty State (No PRs) -->
      <div id="state-empty" class="state-container hidden">
        <div class="empty-icon-wrapper success">
          <svg class="empty-icon success-color" viewBox="0 0 16 16" width="32" height="32">
            <path fill-rule="evenodd" d="M1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0zM0 8a8 8 0 1116 0A8 8 0 010 8zm11.78-1.72a.75.75 0 00-1.06-1.06L6.75 9.19 5.28 7.72a.75.75 0 00-1.06 1.06l2 2a.75.75 0 001.06 0l4.5-4.5z"></path>
          </svg>
        </div>
        <h3>All caught up!</h3>
        <p>No pull requests currently waiting for your review.</p>
      </div>

      <!-- PR List State -->
      <div id="state-prs" class="hidden">
        <ul id="pr-list" class="pr-list">
          <!-- Dynamically populated PR items -->
        </ul>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span id="status-user" class="status-user"></span>
      <span id="status-updated" class="status-updated">Checking...</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
